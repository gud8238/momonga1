name: Deploy Momonga to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: f1bbefa2-ac7f-42f0-b3c6-b9f128588141
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require Netlify token
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Add repository secret NETLIFY_AUTH_TOKEN with a Netlify personal access token."
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Netlify CLI
        run: npm install --global netlify-cli
      - name: Prepare static publish directory
        run: |
          mkdir -p .netlify-publish
          cp index.html .netlify-publish/
          cp -R src assets .netlify-publish/
      - name: Deploy to existing Netlify site
        run: netlify deploy --prod --dir=.netlify-publish --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Deploy from GitHub Actions"
